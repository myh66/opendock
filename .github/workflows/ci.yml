name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle local beta
        run: ./scripts/build-app.sh
      - name: Preserve bundle permissions
        run: ditto -c -k --sequesterRsrc --keepParent build/OpenDock.app build/OpenDock-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: OpenDock-macOS-local-beta
          path: build/OpenDock-macOS.zip
          if-no-files-found: error
